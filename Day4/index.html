<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Day 4</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main>
        <h1>QuickNotes</h1>

        <label for="note-text">Write your note:</label>

        <textarea id="note-text" rows="10" placeholder="Start writing..."></textarea>

        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>

        <button id="clear-btn">Clear</button>
        <button id="theme-toggle">Dark mode</button>
    </main>

</body>
</html>
